{{- if and .Values.app.enabled .Values.global.metrics.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "node.fullname" . }}-metrics
  labels:
    {{- include "node.componentLabels" (dict "root" . "component" "metrics") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ int .Values.global.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "node.componentSelectorLabels" (dict "root" . "component" "app") | nindent 4 }}
{{- end -}}
