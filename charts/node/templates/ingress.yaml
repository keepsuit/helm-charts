{{- if .Values.routing.ingress.enabled -}}
{{- $root := . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "node.fullname" . }}
  labels:
    {{- include "node.labels" . | nindent 4 }}
  {{- with .Values.routing.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.routing.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.routing.ingress.tls }}
  tls:
    {{- if eq (kindOf (first .)) "string" }}
    - hosts:
      {{- range . }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ include "node.fullname" $root }}-tls
    {{- else }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  rules:
  {{- range .Values.routing.ingress.routes }}
    {{- if and (eq .service "app") (not $root.Values.app.enabled) }}
    {{- fail "routing.ingress route references app but app.enabled=false" }}
    {{- end }}
    {{- if ne .service "app" }}
    {{- fail (printf "routing.ingress route has unsupported service %q" .service) }}
    {{- end }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path | default "/" | quote }}
            pathType: {{ .pathType | default "Prefix" | quote }}
            backend:
              service:
                name: {{ include "node.fullname" $root }}-app
                port:
                  number: {{ default $root.Values.app.port $root.Values.app.service.port }}
        {{- end }}
  {{- end }}
{{- end }}
