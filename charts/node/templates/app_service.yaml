{{- if and .Values.app.enabled .Values.app.service.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "node.fullname" . }}-app
  labels:
    {{- include "node.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - name: http
      port: {{ default .Values.app.port .Values.app.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "node.componentSelectorLabels" (dict "root" . "component" "app") | nindent 4 }}
{{- end -}}
