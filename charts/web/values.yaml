#   initContainers: []
#   extraContainers: []

# CronJobs from the same image.
cronJobs: []
# - name: cleanup              # DNS label, CronJob <fullname>-cron-<name>
#   enabled: true
#   schedule: "0 3 * * *"
#   timeZone: Europe/Rome
#   command: [node, scripts/cleanup.mjs]
#   args: []
#   concurrencyPolicy: Forbid
#   successfulJobsHistoryLimit: 3
#   failedJobsHistoryLimit: 1
#   backoffLimit: 0
#   activeDeadlineSeconds: 600
#   resources: {}
#   env: []
#   envFrom: []
#   node:
#     maxOldSpaceFromLimit: false
#   podAnnotations: {}
#   podLabels: {}
#   nodeSelector: {}
#   tolerations: []
#   affinity: {}
#   priorityClassName: ""
#   dnsConfig: {}
#   hostAliases: []
#   extraVolumes: []
#   extraVolumeMounts: []
#   initContainers: []
#   extraContainers: []

routing:
  ingress:
    # Render the Ingress.
    enabled: false
    # ingressClassName, e.g. nginx.
    className: ""
    # Ingress annotations, e.g. cert-manager.io/cluster-issuer.
    annotations: {}
    # Host rules. service must be app.
    routes: []
    # - service: app
    #   host: example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
    # Hostnames sharing the <fullname>-tls secret, or full Kubernetes Ingress TLS objects.
    tls: []
    # - example.com
    # - www.example.com
    # Or pass full Kubernetes Ingress TLS objects:
    # - hosts:
    #     - example.com
    #   secretName: custom-tls

# Jobs run through `sh -c`, so the image needs a shell.
hooks:
  preDeploy:
    # Job run pre-upgrade (post-install on the first install). A failure fails the Helm operation.
    enabled: false
    # Commands run in order, stopping at the first failure.
    commands: []
    # Env vars appended after global.env.
    env: []
    # envFrom sources appended after global.envFrom.
    envFrom: []
    # Container resources.
    resources: {}
    # Job backoffLimit. Omit for the Kubernetes default (6).
    backoffLimit:
    # Job activeDeadlineSeconds.
    activeDeadlineSeconds:
    # Job ttlSecondsAfterFinished.
    ttlSecondsAfterFinished:
  postDeploy:
    # Job run post-install and post-upgrade.
    enabled: false
    # Commands run in order, stopping at the first failure.
    commands: []
    # Env vars appended after global.env.
    env: []
    # envFrom sources appended after global.envFrom.
    envFrom: []
    # Container resources.
    resources: {}
    # Job backoffLimit. Omit for the Kubernetes default (6).
    backoffLimit:
    # Job activeDeadlineSeconds.
    activeDeadlineSeconds:
    # Job ttlSecondsAfterFinished.
    ttlSecondsAfterFinished:
