{{- if and .Values.app.enabled .Values.global.metrics.enabled .Values.global.metrics.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "web.fullname" . }}-metrics
  labels:
    {{- include "web.componentLabels" (dict "root" . "component" "metrics") | nindent 4 }}
    {{- with .Values.global.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "web.componentSelectorLabels" (dict "root" . "component" "metrics") | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.global.metrics.path }}
      interval: {{ .Values.global.metrics.serviceMonitor.interval }}
{{- end -}}
