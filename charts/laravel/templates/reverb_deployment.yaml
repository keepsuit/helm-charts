{{- if .Values.reverb.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laravel.fullname" . }}-reverb
  labels:
    {{- include "laravel.componentLabels" (dict "root" . "component" "reverb") | nindent 4 }}
spec:
  {{- if not .Values.reverb.autoscaling.enabled }}
  replicas: {{ default 1 .Values.reverb.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "laravel.componentSelectorLabels" (dict "root" . "component" "reverb") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- with .Values.reverb.rollingUpdate }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  revisionHistoryLimit: 3
  template:
    metadata:
      {{- include "laravel.podMetadata" (dict "root" . "workload" .Values.reverb "component" "reverb") | nindent 6 }}
    spec:
      {{- include "laravel.podSpecCommon" (dict "root" . "workload" .Values.reverb) | nindent 6 }}
      containers:
        - name: reverb
          {{- with .Values.global.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "laravel.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            - "php"
            - "artisan"
            {{- if (default false .Values.reverb.debug) }}
            - "--debug"
            {{- end }}
            - "--host=0.0.0.0"
            - "--port={{ required "reverb.port is required" .Values.reverb.port }}"
            - "reverb:start"
          ports:
            - name: reverb
              containerPort: {{ int (required "reverb.port is required" .Values.reverb.port) }}
              protocol: TCP
          {{- with .Values.reverb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "laravel.env" (dict "root" . "workload" .Values.reverb "role" "reverb" "extra" (list (dict "name" "REVERB_SCALING_ENABLED" "value" "true")) ) | nindent 12 }}
          {{- include "laravel.envFrom" (dict "root" . "workload" .Values.reverb) | nindent 10 }}
          {{- with .Values.global.secretVolumes }}
          volumeMounts:
            {{- include "laravel.secretVolumeMounts" $ | nindent 12 }}
          {{- end }}
          {{- if .Values.reverb.healthCheck.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ default .Values.reverb.port .Values.reverb.healthCheck.port }}
            initialDelaySeconds: {{ .Values.reverb.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.reverb.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.reverb.healthCheck.timeoutSeconds }}
            failureThreshold: {{ .Values.reverb.healthCheck.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: {{ default .Values.reverb.port .Values.reverb.healthCheck.port }}
            initialDelaySeconds: {{ .Values.reverb.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.reverb.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.reverb.healthCheck.timeoutSeconds }}
            failureThreshold: {{ .Values.reverb.healthCheck.failureThreshold }}
          {{- end }}
      {{- with .Values.global.secretVolumes }}
      volumes:
        {{- include "laravel.secretVolumes" $ | nindent 8 }}
      {{- end }}
{{- end }}
