{{- $root := . -}}
{{- range .Values.workers }}
{{- $worker := . -}}
{{- $autoscaling := default (dict) $worker.autoscaling -}}
{{- if and (default true $worker.enabled) $autoscaling.enabled (eq (default "hpa" $autoscaling.mode) "keda") }}
{{- if not (has $worker.type (list "queue" "horizon")) }}
{{- fail (printf "worker %q type %s cannot use autoscaling mode keda" $worker.name $worker.type) }}
{{- end }}
{{- if not $root.Values.global.metrics.enabled }}
{{- fail (printf "worker %q uses autoscaling mode keda which requires global.metrics.enabled" $worker.name) }}
{{- end }}
{{- if not $root.Values.app.enabled }}
{{- fail (printf "worker %q uses autoscaling mode keda which requires app.enabled (the metrics endpoint is served by the app pods)" $worker.name) }}
{{- end }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "laravel.componentName" (dict "root" $root "name" (printf "worker-%s" $worker.name)) }}
  labels:
    {{- include "laravel.componentLabels" (dict "root" $root "component" (printf "worker-%s" $worker.name)) | nindent 4 }}
    laravel.keepcloud.io/worker-type: {{ $worker.type | quote }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "laravel.componentName" (dict "root" $root "name" (printf "worker-%s" $worker.name)) }}
  minReplicaCount: {{ default 0 $autoscaling.minReplicas }}
  maxReplicaCount: {{ default 5 $autoscaling.maxReplicas }}
  {{- with $autoscaling.cooldownPeriod }}
  cooldownPeriod: {{ . }}
  {{- end }}
  triggers:
    - type: metrics-api
      metadata:
        url: {{ printf "http://%s-metrics.%s.svc.cluster.local:8081/_metrics/queue-size" (include "laravel.fullname" $root) $root.Release.Namespace }}{{ with $worker.queue }}?queues={{ . }}{{ end }}
        valueLocation: size
        targetValue: {{ default 10 $autoscaling.targetValue | quote }}
  fallback:
    failureThreshold: 3
    replicas: 1
{{- end }}
{{- end }}
