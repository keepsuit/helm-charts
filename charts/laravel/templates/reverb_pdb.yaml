{{- if and .Values.reverb.enabled (gt (int .Values.reverb.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "laravel.fullname" . }}-reverb
  labels:
    {{- include "laravel.componentLabels" (dict "root" . "component" "reverb") | nindent 4 }}
spec:
  minAvailable: {{ default 1 .Values.reverb.minAvailable }}
  selector:
    matchLabels:
      {{- include "laravel.componentSelectorLabels" (dict "root" . "component" "reverb") | nindent 6 }}
{{- end }}
