{{- if .Values.app.enabled -}}
{{- $appPodAnnotations := mergeOverwrite (deepCopy (default (dict) .Values.global.podAnnotations)) (default (dict) .Values.app.podAnnotations) -}}
{{- $appPodLabels := mergeOverwrite (deepCopy (default (dict) .Values.global.podLabels)) (default (dict) .Values.app.podLabels) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laravel.fullname" . }}-app
  labels:
    {{- include "laravel.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicas }}
  {{- end }}
  {{- with .Values.app.progressDeadlineSeconds }}
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "laravel.appSelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- with .Values.app.rollingUpdate }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        {{- include "laravel.appPodLabels" . | nindent 8 }}
        {{- if .Values.global.metrics.enabled }}
        laravel.keepcloud.io/metrics: "true"
        {{- end }}
        {{- with $appPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $appPodAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "laravel.podSpecCommon" (dict "root" . "workload" .Values.app) | nindent 6 }}
      containers:
        - name: app
          {{- with .Values.global.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "laravel.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- if .Values.app.octane.enabled }}
          args:
            - "php"
            - "artisan"
            - "octane:start"
            - "--port={{ .Values.app.port }}"
            - "--host=0.0.0.0"
            - "--workers={{ .Values.app.octane.workers | default "auto" }}"
            - "--log-level={{ .Values.app.octane.logLevel | default "info" }}"
            {{- range .Values.app.octane.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ int .Values.app.port }}
              protocol: TCP
            {{- if .Values.global.metrics.enabled }}
            - name: metrics
              containerPort: 8081
              protocol: TCP
            {{- end }}
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "laravel.env" (dict "root" . "workload" .Values.app "role" "app") | nindent 12 }}
          {{- include "laravel.envFrom" (dict "root" . "workload" .Values.app) | nindent 10 }}
          {{- with .Values.global.secretVolumes }}
          volumeMounts:
            {{- include "laravel.secretVolumeMounts" $ | nindent 12 }}
          {{- end }}
          {{- if .Values.app.healthCheck.enabled }}
          {{- include "laravel.appProbes" . | nindent 10 }}
          {{- end }}
          {{- if .Values.app.octane.enabled }}
          lifecycle:
            preStop:
              exec:
                command: ["php", "artisan", "octane:stop"]
          {{- end }}
      {{- with .Values.global.secretVolumes }}
      volumes:
        {{- include "laravel.secretVolumes" $ | nindent 8 }}
      {{- end }}
{{- end -}}
