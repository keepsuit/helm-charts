        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 3
        httpGet: *5
  - equal:
      path: spec.template.spec.containers[0].livenessProbe
      value:
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
        httpGet: *5
