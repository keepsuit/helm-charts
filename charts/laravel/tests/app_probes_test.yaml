---
suite: Application probes
templates:
- app_deployment.yaml
set:
  global.image.repository: example/app
  global.image.tag: test
tests:
- it: preserves generated classic defaults
  set:
    app.octane.enabled: false
  asserts:
  - equal:
      path: spec.template.spec.containers[0].startupProbe
      value:
        periodSeconds: 2
        timeoutSeconds: 5
        failureThreshold: 60
        httpGet: &1
          path: "/healthcheck"
          port: 8080
  - equal:
      path: spec.template.spec.containers[0].readinessProbe
      value:
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 3
        httpGet: *1
  - equal:
      path: spec.template.spec.containers[0].livenessProbe
      value:
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
        httpGet: *1
  - notExists:
      path: spec.progressDeadlineSeconds
  - notExists:
      path: spec.template.spec.containers[0].lifecycle
- it: keeps classic handlers when overriding timings
  set:
    app.octane.enabled: false
    app.startupProbe:
      periodSeconds: 5
      failureThreshold: 120
    app.readinessProbe:
      timeoutSeconds: 8
      successThreshold: 2
    app.livenessProbe:
      initialDelaySeconds: 0
  asserts:
  - equal:
      path: spec.template.spec.containers[0].startupProbe
      value:
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 120
        httpGet: *1
  - equal:
      path: spec.template.spec.containers[0].readinessProbe
      value:
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 8
        failureThreshold: 3
        httpGet: *1
        successThreshold: 2
  - equal:
      path: spec.template.spec.containers[0].livenessProbe
      value:
        initialDelaySeconds: 0
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
        httpGet: *1
- it: replaces classic checks with exec for all probes
  set:
    app.octane.enabled: false
    app.startupProbe: &2
      exec: &3
        command:
        - test
        - "-f"
        - "/tmp/ready"
    app.readinessProbe: *2
    app.livenessProbe: *2
  asserts:
  - equal:
      path: spec.template.spec.containers[0].startupProbe
      value:
        periodSeconds: 2
        timeoutSeconds: 5
        failureThreshold: 60
        exec: *3
  - equal:
      path: spec.template.spec.containers[0].readinessProbe
      value:
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 3
        exec: *3
  - equal:
      path: spec.template.spec.containers[0].livenessProbe
      value:
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
        exec: *3
- it: replaces classic checks with httpGet for all probes
  set:
    app.octane.enabled: false
    app.startupProbe: &4
      httpGet: &5
        port: http
        path: "/up"
    app.readinessProbe: *4
    app.livenessProbe: *4
  asserts:
  - equal:
      path: spec.template.spec.containers[0].startupProbe
      value:
        periodSeconds: 2
        timeoutSeconds: 5
        failureThreshold: 60
        httpGet: *5
  - equal:
