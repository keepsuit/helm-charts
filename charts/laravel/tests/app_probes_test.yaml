      path: spec.template.spec.containers[0].startupProbe
  - equal:
      path: spec.template.spec.containers[0].readinessProbe
      value:
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 3
        httpGet: *1
  - equal:
      path: spec.template.spec.containers[0].livenessProbe
      value:
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
        httpGet: *1
- it: disables only readinessProbe in classic mode
  set:
    app.octane.enabled: false
