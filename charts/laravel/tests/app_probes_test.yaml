- it: preserves generated Octane defaults
  set:
    app.octane.enabled: true
  asserts:
  - equal:
      path: spec.template.spec.containers[0].startupProbe
      value:
        periodSeconds: 2
        timeoutSeconds: 5
        failureThreshold: 60
        exec: &10
          command:
          - php
          - artisan
          - octane:status
  - equal:
      path: spec.template.spec.containers[0].readinessProbe
      value:
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 3
        exec: *10
  - equal:
      path: spec.template.spec.containers[0].livenessProbe
      value:
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
        exec: *10
  - notExists:
      path: spec.progressDeadlineSeconds
  - equal:
      path: spec.template.spec.containers[0].lifecycle
      value:
        preStop:
          exec:
            command:
            - php
            - artisan
            - octane:stop
- it: keeps Octane handlers when overriding timings
  set:
    app.octane.enabled: true
    app.startupProbe:
      periodSeconds: 5
      failureThreshold: 120
    app.readinessProbe:
      timeoutSeconds: 8
      successThreshold: 2
    app.livenessProbe:
      initialDelaySeconds: 0
  asserts:
  - equal:
