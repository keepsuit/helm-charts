# Default values for the generic Laravel chart.

global:
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  serviceAccountAnnotations: {}
  env: []
  envFrom: []
  secretVolumes: []
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  workerCommand:
    useWrapper: true
    binary: docker-laravel-worker
  # Enable only if the image exposes the queue metrics endpoint on port 8081
  # (GET /_metrics/queue-size). Required by workers with autoscaling.mode=keda.
  metrics:
    enabled: false

app:
  enabled: true
  replicas: 2
  minAvailable: 1
  port: 8080
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  service:
    enabled: true
    type: ClusterIP
    port:
  octane:
    enabled: false
    workers: auto
    logLevel: info
  healthCheck:
    enabled: true
    path: /healthcheck
    port:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  resources:
    requests:
      cpu: "15m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "640Mi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage:

# Default flags for workers of type "queue" and "combined"
queueOptions:
  maxTime: 3600
  memory: 128

# Fallback resources applied to a worker that does not set its own.
workerResources:
  queue:
    requests:
      cpu: "5m"
      memory: "96Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"
  horizon:
    requests:
      cpu: "5m"
      memory: "192Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"
  scheduler:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "500m"
      memory: "640Mi"
  combined:
    requests:
      cpu: "10m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

workers: []
# - name: default
#   type: queue
#   enabled: true
#   replicas: 1
#   queue: default
#   queueOptions:
#     sleep:
#     tries:
#     timeout:
#     maxTime:
#     memory:
#     backoff:
#   env: []
#   envFrom: []
#   podAnnotations: {}
#   podLabels: {}
#   nodeSelector: {}
#   tolerations: []
#   affinity: {}
#   topologySpreadConstraints: []
#   resources: {}  # omit to inherit workerResources[type]
#   autoscaling:
#     enabled: false
#     mode: hpa            # hpa (cpu/memory) or keda (queue depth, scales to zero)
#     minReplicas: 1       # defaults to 0 when mode=keda
#     maxReplicas: 5
#     targetCPUUtilizationPercentage: 80   # hpa only
#     targetValue: 10      # keda only: queue depth per replica
#     cooldownPeriod:      # keda only: seconds before scaling to zero (KEDA default 300)
#     targetMemoryUtilizationPercentage:
# - name: scheduler
#   type: scheduler
#   enabled: false
#   env: []
#   envFrom: []
#   resources: {}
# - name: combined
#   type: combined
#   enabled: false
#   queue: default
#   queueOptions: {}
#   env: []
#   envFrom: []
#   resources: {}

reverb:
  enabled: false
  replicas: 1
  minAvailable: 1
  port: 8080
  debug: false
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  service:
    enabled: true
    type: ClusterIP
    port:
  healthCheck:
    enabled: true
    type: tcp
    port:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  rollingUpdate:
    maxSurge: 1
  resources:
    requests:
      cpu: "20m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "384Mi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage:

routing:
  ingress:
    enabled: false
    className: ""
    annotations: {}
    routes: []
    # - service: app
    #   host: example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
    tls: []
    # - example.com
    # - www.example.com
    # Or pass full Kubernetes Ingress TLS objects:
    # - hosts:
    #     - example.com
    #   secretName: custom-tls

hooks:
  postDeploy:
    enabled: false
    commands:
      - php artisan migrate --force -n
    env: []
    envFrom: []
    resources: {}
