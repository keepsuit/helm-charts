# Default values for the generic Laravel chart.

global:
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  serviceAccountAnnotations: {}
  env: []
  envFrom: []
  secretVolumes: []
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  workerCommand:
    useWrapper: true
    binary: docker-laravel-worker

app:
  enabled: true
  replicas: 2
  minAvailable: 1
  port: 8080
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  service:
    enabled: true
    type: ClusterIP
    port:
  healthCheck:
    enabled: true
    path: /healthcheck
    port:
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "640Mi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage:

workers: []
# - name: default
#   type: queue
