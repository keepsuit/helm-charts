reverb:
  enabled: false
  replicas: 1
  minAvailable: 1
  port: 8080
  debug: false
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  service:
    enabled: true
    type: ClusterIP
    port:
  healthCheck:
    enabled: true
    type: tcp
    port:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
  rollingUpdate:
    maxSurge: 1
  resources:
    requests:
      cpu: "10m"
      memory: "192Mi"
    limits:
      cpu: "100m"
      memory: "384Mi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage:

routing:
  ingress:
    enabled: false
    className: ""
    annotations: {}
    routes: []
    # - service: app
    #   host: example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
    tls: []
    # - example.com
    # - www.example.com
    # Or pass full Kubernetes Ingress TLS objects:
    # - hosts:
    #     - example.com
    #   secretName: custom-tls

hooks:
  postDeploy:
    enabled: false
    commands:
      - php artisan migrate --force -n
    env: []
    envFrom: []
    resources: {}
