global:
  image:
    repository: debug/image
    tag: v1
  secretVolumes:
    - name: secret-name
      mountPath: /storage
      items:
        - key: filename-source
          path: filename-destination

app:
  port: 8080
  healthCheck:
    path: /healthcheck
    port: 8080

workers:
  - name: horizon
    type: horizon
    enabled: true
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
    nodeSelector:
      kubernetes.io/arch: arm64
  - name: default
    type: queue
    enabled: true

reverb:
  enabled: true
  debug: true
  replicas: 2

hooks:
  postDeploy:
    enabled: true
    commands:
      - php artisan migrate --force -n
      - php artisan db:seed --force -n
